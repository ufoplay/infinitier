[package]
name = "infinitier_explorer_slint"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Slint reimplementation of the Infinitier Explorer resource browser GUI"
publish = false

[dependencies]
infinitier_core = { workspace = true }

bytesize = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
rodio = { workspace = true }
# Software renderer + winit, like the Slint keeper. `unstable-fontique-011`
# registers a TTF resource's font at run time (the TTF viewer) and finds the
# system's monospace family (the code views); `~` because the feature is
# unstable across minor releases.
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "unstable-fontique-011",
] }

[dev-dependencies]
# The token lint, run on the explorer's own UI (tests/ui_tokens.rs).
slint-themekit = { workspace = true }

[build-dependencies]
slint-build = "~1.18"
# Registers the themekit's `.slint` sources as the `@themekit` library.
slint-themekit = { workspace = true }
vergen-gix = { workspace = true }

[features]
# Opt-in embedded MCP test server (dev only): build with `--features mcp`,
# run with `SLINT_MCP_PORT=8080` to expose http://localhost:8080/mcp so an
# AI agent can inspect the accessibility tree, click/type, and screenshot.
mcp = ["slint/mcp"]
