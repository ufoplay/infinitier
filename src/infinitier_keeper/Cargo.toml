[package]
name = "infinitier_keeper"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Infinitier Keeper: a save-game editor for Infinity Engine games"
publish = false

[dependencies]
infinitier_core = { workspace = true }
infinitier_gui_common = { workspace = true }

clap = { workspace = true }
env_logger = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
# Software renderer + winit (see the workspace manifest); the window handle
# parents the folder picker to the keeper's window.
slint = { workspace = true, features = ["raw-window-handle-06"] }

[dev-dependencies]
# The token lint, run on the keeper's own UI (tests/ui_tokens.rs).
slint-themekit = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
# Registers the themekit's `.slint` sources as the `@themekit` library.
slint-themekit = { workspace = true }
# Git version info for the startup log and the window title.
vergen-gix = { workspace = true }

[features]
# Opt-in embedded MCP test server (dev only): build with `--features mcp`,
# run with `SLINT_MCP_PORT=8080` to expose http://localhost:8080/mcp so an
# AI agent can inspect the accessibility tree, click/type, and screenshot.
mcp = ["slint/mcp"]
