[package]
name = "infinitier_keeper_slint"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Slint reimplementation of the Infinitier Keeper save-game editor GUI"
publish = false

[dependencies]
infinitier_core = { workspace = true }

clap = { workspace = true }
env_logger = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# Software renderer + winit: no GL dev-lib dependency. Text needs the
# fontconfig runtime lib (Slint's text stack); the dev package is only a
# build-time linker requirement (see readme.md).
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }

[dev-dependencies]
# The token lint, run on the keeper's own UI (tests/ui_tokens.rs).
slint-themekit = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
slint-build = "1.17"
# Registers the themekit's `.slint` sources as the `@themekit` library.
slint-themekit = { workspace = true }
# Git version info for the window title, like the egui keeper.
vergen-gix = { workspace = true }

[features]
# Opt-in embedded MCP test server (dev only): build with `--features mcp`,
# run with `SLINT_MCP_PORT=8080` to expose http://localhost:8080/mcp so an
# AI agent can inspect the accessibility tree, click/type, and screenshot.
mcp = ["slint/mcp"]
