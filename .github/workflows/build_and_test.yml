name: Rust Build and Test

on:
  pull_request:
    branches:
    - main
    - develop
  push:
    branches:
    - main
    - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: prepare image
        run: |
          sudo apt-get update
          # ALSA for the explorer's audio; fontconfig for Slint's text
          # stack (a build-time linker requirement).
          sudo apt-get install -y libasound2-dev libfontconfig1-dev

      - uses: actions/checkout@v4
     
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Just command runner
        uses: extractions/setup-just@v1
        
      - name: check rust code style
        run: |
          just check_code

      - name: build
        run: |
          just build

      - name: test
        run: |
          just test

